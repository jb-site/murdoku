<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murdoku</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Murdoku</h1>
  <p class="subtitle">Place every suspect on the grid — one per row, one per column.</p>
  <div class="puzzle-picker">
    <label for="puzzleSelect">Puzzle:</label>
    <select id="puzzleSelect"></select>
  </div>
</header>

<main>
  <section class="toolbar">
    <div class="tool-group">
      <button class="tool-btn" id="undoBtn" title="Undo last action">↶ Undo</button>
      <button class="tool-btn" id="clearBtn" title="Clear the whole grid">🗑 Clear</button>
      <button class="tool-btn" id="saveBtn" title="Save your progress to a file">💾 Save to file</button>
      <button class="tool-btn" id="loadBtn" title="Load progress from a file">📂 Load from file</button>
      <input type="file" id="loadInput" accept="application/json" hidden>
      <span class="autosave-note" id="autosaveNote"></span>
      <button class="tool-btn" id="editBtn" title="Edit this puzzle's grid, rooms and objects">✏️ Edit puzzle</button>
    </div>

    <div class="suspect-palette" id="suspectPalette"></div>
  </section>

  <section class="editor-bar" id="editorBar" hidden>
    <div class="editor-row">
      <strong>Editing puzzle</strong> — solving is paused.
      <span class="editor-spacer"></span>
      <button class="tool-btn" id="editApplyBtn" title="Use these edits now, in this browser session">✅ Apply</button>
      <button class="tool-btn" id="editDiscardBtn" title="Throw away edits and go back to solving">✖ Discard</button>
      <button class="tool-btn" id="editDownloadBtn" title="Download the edited puzzle as a JSON file">⬇️ Download JSON</button>
    </div>
    <div class="editor-row">
      <button class="tool-btn" id="editNewBtn" title="Start a blank puzzle">＋ New</button>
      <button class="tool-btn" id="editOpenBtn" title="Open a puzzle JSON file to edit">📂 Open file…</button>
      <input type="file" id="editFileInput" accept="application/json" hidden>
      <span class="editor-spacer"></span>
      <label>Rows <input type="number" id="editRows" min="1" max="24"></label>
      <label>Cols <input type="number" id="editCols" min="1" max="24"></label>
      <button class="tool-btn" id="editResizeBtn">Resize</button>
    </div>
    <div class="editor-row" id="editorTabs">
      <button class="tool-btn edit-tab active" data-tab="rooms">Rooms</button>
      <button class="tool-btn edit-tab" data-tab="objects">Objects</button>
      <button class="tool-btn edit-tab" data-tab="details">Details</button>
    </div>
    <div class="editor-palette" id="editorPalette"></div>
    <div class="editor-details" id="editorDetails" hidden></div>
    <div class="editor-validation" id="editorValidation"></div>
  </section>

  <section class="puzzle-meta" id="puzzleMeta">
    <h2 id="puzzleTitle"></h2>
    <span class="difficulty-badge" id="puzzleDifficulty"></span>
  </section>

  <div class="workspace" id="workspace">
    <section class="grid-wrap">
      <div id="grid" class="grid">
        <div id="layerCells" class="grid-layer layer-cells"></div>
        <div id="layerObjects" class="grid-layer layer-objects"></div>
        <div id="layerLabels" class="grid-layer layer-labels"></div>
        <div id="layerMarks" class="grid-layer layer-marks"></div>
        <div id="layerHeaders" class="grid-layer layer-headers"></div>
      </div>
      <p id="status" class="status-line"></p>
    </section>

    <div class="resize-handle" id="resizeHandle" role="separator" aria-orientation="vertical"
         tabindex="0" aria-label="Resize clues column"></div>

    <section class="clues">
      <h2>Clues</h2>
      <ul id="clueList"></ul>
    </section>
  </div>

  <section class="hint">
    <p id="hint">Pick a suspect, ✕, or Erase below, then click, hold, or drag on the grid.</p>
  </section>

  <section class="legend" id="legend"></section>
</main>

<script src="app.js"></script>
</body>
</html>
