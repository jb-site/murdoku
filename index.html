<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murdoku</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Murdoku</h1>
  <p class="subtitle">Place every suspect on the grid — one per row, one per column.</p>
  <div class="puzzle-picker">
    <label for="puzzleSelect">Puzzle:</label>
    <select id="puzzleSelect"></select>
  </div>
</header>

<main>
  <div id="controlsDock" class="controls-dock">
    <button type="button" id="controlsToggle" class="controls-toggle"
            aria-controls="toolbar" aria-expanded="true"
            title="Collapse the controls">▾</button>
    <section class="toolbar" id="toolbar">
      <div class="tool-group">
        <button class="tool-btn" id="undoBtn" title="Undo last action">↶ Undo</button>
        <button class="tool-btn" id="clearBtn" title="Clear the whole grid">🗑 Clear</button>
        <button class="tool-btn" id="saveBtn" title="Save your progress to a file">💾 Save to file</button>
        <button class="tool-btn" id="loadBtn" title="Load progress from a file">📂 Load from file</button>
        <input type="file" id="loadInput" accept="application/json" hidden>
        <span class="autosave-note" id="autosaveNote"></span>
        <button class="tool-btn" id="editBtn" title="Edit this puzzle's grid, rooms and objects">✏️ Edit puzzle</button>
      </div>

      <div class="suspect-palette" id="suspectPalette"></div>

      <div class="tool-group view-options" id="viewOptions">
        <label><input type="checkbox" id="prefColorPencils"> Colour pencil marks</label>
        <label><input type="checkbox" id="prefPlayerNotes"> Player notes</label>
        <label id="prefPortraitsLabel" hidden><input type="checkbox" id="prefPortraits"> Suspect portraits</label>
        <label id="prefArtModeLabel" hidden><input type="checkbox" id="prefArtMode"> Board art</label>
        <div class="zoom-controls" id="zoomControls">
          <button type="button" id="zoomOutBtn" class="tool-btn zoom-btn" aria-label="Zoom out" title="Zoom out">−</button>
          <button type="button" id="zoomFitBtn" class="tool-btn zoom-btn" aria-label="Fit grid to screen" title="Fit grid to screen">Fit</button>
          <button type="button" id="zoomInBtn" class="tool-btn zoom-btn" aria-label="Zoom in" title="Zoom in">+</button>
        </div>
      </div>
    </section>

    <section class="editor-bar" id="editorBar" hidden>
      <div class="editor-row">
        <strong>Editing puzzle</strong> — solving is paused.
        <span class="editor-spacer"></span>
        <button class="tool-btn" id="editApplyBtn" title="Use these edits now, in this browser session">✅ Apply</button>
        <button class="tool-btn" id="editDiscardBtn" title="Throw away edits and go back to solving">✖ Discard</button>
        <button class="tool-btn" id="editDownloadBtn" title="Download the edited puzzle as a JSON file">⬇️ Download JSON</button>
      </div>
      <details class="editor-disclosure">
        <summary>Puzzle setup</summary>
        <div class="editor-row">
          <button class="tool-btn" id="editNewBtn" title="Start a blank puzzle">＋ New</button>
          <button class="tool-btn" id="editOpenBtn" title="Open a puzzle JSON file to edit">📂 Open file…</button>
          <input type="file" id="editFileInput" accept="application/json" hidden>
          <span class="editor-spacer"></span>
          <label>Rows <input type="number" id="editRows" min="1" max="24"></label>
          <label>Cols <input type="number" id="editCols" min="1" max="24"></label>
          <button class="tool-btn" id="editResizeBtn">Resize</button>
        </div>
      </details>
      <div class="editor-row" id="editorTabs">
        <button class="tool-btn edit-tab active" data-tab="rooms">Rooms</button>
        <button class="tool-btn edit-tab" data-tab="objects">Objects</button>
        <button class="tool-btn edit-tab" data-tab="details">Details</button>
        <button class="tool-btn edit-tab" data-tab="art">Art</button>
      </div>
      <details class="editor-disclosure" id="editorArtView" hidden>
        <summary>🎨 Art view</summary>
        <div class="editor-row">
          <label id="editArtModeLabel"><input type="checkbox" id="editArtMode"> Board art</label>
          <label id="artStackLabel">Art layer
            <select id="artStack" title="Choose where the board art sits relative to the grid, objects and marks">
              <option value="bottom">Below grid</option>
              <option value="mid">Above grid, below objects</option>
              <option value="top">Above everything</option>
            </select>
          </label>
          <div class="editor-row art-opacity-row" id="editorOpacityRow">
            <label>Art<input type="range" min="0" max="100" step="1" data-op="art"><span class="art-op-value" data-op-value="art"></span></label>
            <label>Grid<input type="range" min="0" max="100" step="1" data-op="grid"><span class="art-op-value" data-op-value="grid"></span></label>
            <label>Objects<input type="range" min="0" max="100" step="1" data-op="objects"><span class="art-op-value" data-op-value="objects"></span></label>
          </div>
          <button type="button" class="tool-btn" id="artOpResetBtn" title="Reset to defaults (Art 100%, Grid 50%, Objects 100%)">↺ Reset opacities</button>
        </div>
      </details>
      <div class="editor-palette" id="editorPalette"></div>
      <div class="editor-details" id="editorDetails" hidden></div>
      <div class="editor-validation" id="editorValidation"></div>
    </section>
  </div>

  <section class="puzzle-meta" id="puzzleMeta">
    <h2 id="puzzleTitle"></h2>
    <span class="difficulty-badge" id="puzzleDifficulty"></span>
  </section>

  <div class="workspace" id="workspace">
    <section class="grid-wrap" id="gridWrap">
      <div id="gridZoomBox" class="grid-zoom-box">
        <div id="grid" class="grid">
          <div id="layerArt" class="grid-layer layer-art"></div>
          <div id="layerCells" class="grid-layer layer-cells"></div>
          <div id="layerGround" class="grid-layer layer-ground"></div>
          <div id="layerObjects" class="grid-layer layer-objects"></div>
          <div id="layerLabels" class="grid-layer layer-labels"></div>
          <div id="layerMarks" class="grid-layer layer-marks"></div>
          <div id="layerHeaders" class="grid-layer layer-headers"></div>
        </div>
      </div>
      <button type="button" id="solveBtn" class="solve-btn" hidden>Solved!?</button>
      <button type="button" id="storyBtn" class="solve-btn story-btn" hidden>📖 The story</button>
      <figure id="boardLegend" class="board-legend" hidden>
        <img id="boardLegendImg" src="" alt="Puzzle legend: which objects can and cannot be occupied">
      </figure>
    </section>

    <div class="resize-handle" id="resizeHandle" role="separator" aria-orientation="vertical"
         tabindex="0" aria-label="Resize clues column"></div>

    <section class="clues">
      <h2>Clues</h2>
      <ul id="clueList"></ul>
    </section>
  </div>

  <section class="hint">
    <p id="hint">Pick a suspect, ✕, or Erase below, then click, hold, or drag on the grid.</p>
  </section>

  <section class="players" id="playerPanel"></section>

  <section class="legend" id="legend"></section>
</main>

<div id="statusDock" class="status-dock empty">
  <p id="status" class="status-line"></p>
</div>

<div id="verdictBackdrop" class="verdict-backdrop" hidden>
  <div id="verdictPanel" class="verdict-panel" role="dialog" aria-modal="true" aria-labelledby="verdictTitle">
    <h2 id="verdictTitle"></h2>
    <div id="verdictBody" class="verdict-body"></div>
    <div class="verdict-actions">
      <button type="button" id="verdictEscapeBtn" class="tool-btn verdict-escape-btn" hidden>Show me what happened anyway</button>
      <button type="button" id="verdictDismissBtn" class="tool-btn">Keep trying</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
